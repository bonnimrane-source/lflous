<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Boutique Imo</title>
<style>
body{margin:0;font-family:Arial;background:#EAEDED;}
.header{background:#131921;color:white;padding:10px 20px;text-align:center;}
.header .logo{font-size:22px;color:#FF9900;font-weight:bold;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:20px;}
.product{background:white;padding:15px;border-radius:8px;box-shadow:0 0 5px rgba(0,0,0,0.1);}
.product img{width:100%;height:180px;object-fit:cover;}
.price{color:#B12704;font-weight:bold;font-size:18px;}
button{background:#FFD814;border:1px solid #FCD200;padding:8px;width:100%;cursor:pointer;margin-top:10px;}
#cart{background:white;margin:20px;padding:20px;border-radius:8px;}
input,textarea{width:95%;padding:8px;margin:5px 0;border-radius:5px;border:1px solid #ccc;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Boutique Imo</div>
</div>

<div class="products">
  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Produit+1">
    <h3>Produit 1</h3>
    <p class="price">150 DH</p>
    <button onclick="addToCart('Produit 1',150)">Ajouter au panier</button>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Produit+2">
    <h3>Produit 2</h3>
    <p class="price">220 DH</p>
    <button onclick="addToCart('Produit 2',220)">Ajouter au panier</button>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Produit+3">
    <h3>Produit 3</h3>
    <p class="price">340 DH</p>
    <button onclick="addToCart('Produit 3',340)">Ajouter au panier</button>
  </div>
</div>

<div id="cart">
  <h2>Votre Panier</h2>
  <ul id="cart-items"></ul>
  <h3>Total: <span id="total">0</span> DH</h3>

  <h2>Informations de commande</h2>
  <form action="https://formsubmit.co/el/cukeza" method="POST">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="merci.html">
    <input type="hidden" name="Produits" id="productsInput">
    <input type="hidden" name="Total" id="totalInput">

    <input type="text" name="Nom" placeholder="Nom complet" required>
    <input type="text" name="Telephone" placeholder="Numero téléphone" required>
    <input type="text" name="Ville" placeholder="Ville" required>
    <input type="text" name="Adresse" placeholder="Adresse exacte" required>
    <textarea name="Remarque" placeholder="Remarque (optionnel)"></textarea>

    <br>
    <button type="submit">Valider Commande</button>
  </form>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name,price){
  cart.push(name + " - " + price + " DH");
  total += price;

  document.getElementById("cart-items").innerHTML =
    cart.map(item => "<li>"+item+"</li>").join("");

  document.getElementById("total").innerText = total;
  document.getElementById("productsInput").value = cart.join(", ");
  document.getElementById("totalInput").value = total + " DH";
}
</script>

</body>
</html>
